name: Manual Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  manual-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test:ci
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Build application
        run: pnpm run deploy:prod
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://sciss.org/api

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
        continue-on-error: false
        if: ${{ secrets.HOSTINGER_SSH_KEY != '' }}

      - name: Add known hosts
        run: |
          echo "Setting up SSH known hosts..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.HOSTINGER_HOST }}" ] && [ -n "${{ secrets.HOSTINGER_SSH_PORT }}" ]; then
            ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts || {
              echo "⚠️ SSH keyscan failed, but continuing..."
            }
            echo "✅ SSH setup completed"
          else
            echo "⚠️ SSH credentials not fully configured"
          fi
        continue-on-error: true

      - name: Deploy to Hostinger
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}..."
          
          # Check if all required secrets are set
          if [ -z "${{ secrets.HOSTINGER_USER }}" ] || [ -z "${{ secrets.HOSTINGER_HOST }}" ] || [ -z "${{ secrets.HOSTINGER_PATH }}" ] || [ -z "${{ secrets.HOSTINGER_SSH_PORT }}" ]; then
            echo "⚠️ Required deployment secrets not configured. Skipping deployment."
            echo "Build completed successfully but deployment was skipped."
            exit 0
          fi

          # Create deployment script
          cat > deploy_manual.sh << 'EOF'
          #!/bin/bash
          REMOTE_USER="${{ secrets.HOSTINGER_USER }}"
          REMOTE_HOST="${{ secrets.HOSTINGER_HOST }}"
          REMOTE_PATH="${{ secrets.HOSTINGER_PATH }}"
          SSH_PORT="${{ secrets.HOSTINGER_SSH_PORT }}"

          echo "Manual deployment to Hostinger..."
          echo "Remote: $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"
          echo "SSH Port: $SSH_PORT"

          # Test SSH connection first
          echo "Testing SSH connection..."
          ssh -p $SSH_PORT -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "echo 'SSH connection successful'" || {
            echo "⚠️ SSH connection failed, but continuing with deployment..."
          }

          # Sync everything except videos (keep images for the website)
          echo "Starting file sync..."
          rsync -avz --progress --itemize-changes \
            -e "ssh -p $SSH_PORT -o ConnectTimeout=10 -o StrictHostKeyChecking=no" \
            --exclude='.DS_Store' \
            --exclude='videos/' \
            dist/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/" || {
            echo "⚠️ Rsync failed, but deployment may have partially succeeded"
            exit 0
          }
            
          echo "✅ Manual deployment complete!"
          EOF

          chmod +x deploy_manual.sh
          ./deploy_manual.sh
        continue-on-error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-deploy-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: Fallback Deployment (if SSH fails)
        if: failure() && github.event.inputs.environment == 'production'
        run: |
          echo "SSH deployment failed, attempting fallback deployment method..."
          echo "This would typically involve alternative deployment methods"
          echo "Build artifacts are available in the dist/ folder"
          echo "Manual deployment may be required"
          echo "You can download the build artifacts from the Actions tab"
        continue-on-error: true

      - name: Health check
        run: |
          echo "Performing post-deployment health check..."
          sleep 10
          curl -f ${{ secrets.HEALTH_CHECK_URL }} || exit 1
          echo "Health check passed!"